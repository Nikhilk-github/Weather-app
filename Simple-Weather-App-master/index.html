<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>

  <canvas id="weatherCanvas"></canvas>

  <div class="app-wrap">
    <header>
      <input
        type="text"
        autocomplete="off"
        class="search-box"
        placeholder="Search for a city..."
      />
    </header>

    <main>
      <div class="city-box">
        <section class="location">
          <div class="city">Dehradun, IN</div>
          <div class="date">Friday 24 April 2026</div>
        </section>
      </div>

      <div class="current">
        <div class="temp">--<span>°c</span></div>
        <div class="weather">
          <span class="weather-emoji">🌡️</span>
          <span class="weather-text">Loading...</span>
        </div>
        <div class="hi-low">-- / --</div>
      </div>
    </main>
  </div>

  <script src="main.js"></script>
</body>
</html>
